[project]
name = "drova-voice"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "num2words>=0.5.13"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.17", "mypy>=1.13", "types-PyYAML"]
# export world: Welt-Dialoge aus den Addressables-Bundles lesen
assets = ["UnityPy>=1.25"]

[project.scripts]
drova-voice = "drova_voice.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drova_voice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["drova_voice", "tests", "workers"]

[tool.ruff.lint]
# Pinned Ruff release defaults. TRY004 would turn ValueError into TypeError for bad
# config values; callers and tests depend on ValueError.
ignore = ["TRY004"]

[tool.ruff.lint.isort]
known-first-party = ["drova_voice"]

[tool.mypy]
python_version = "3.11"
files = ["drova_voice", "workers"]  # Tests bleiben ungetypt
mypy_path = ["workers/_common"]
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "num2words",
    "torch",
    "soundfile",
    "kittenml",
    "chatterbox.*",
    "TTS.*",
    "numpy",
    "UnityPy",
]
ignore_missing_imports = true
