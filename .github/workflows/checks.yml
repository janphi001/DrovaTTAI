name: checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select tests
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          EVENT = os.environ.get("EVENT_NAME", "")
          ZERO = "0" * 40
          SHA_RE = re.compile(r"^[0-9a-fA-F]{40}$")
          WORKFLOW = ".github/workflows/checks.yml"
          GENERATOR_PREFIXES = ("generator/", "casting/", "tests/vectors/")
          CORE_PREFIXES = ("mod/", "tests/vectors/")


          def emit(generator: bool, core: bool) -> None:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write(f"generator={'true' if generator else 'false'}\n")
                  handle.write(f"core={'true' if core else 'false'}\n")
              print(f"generator={generator} core={core}")


          def flagged(path: str, prefixes: tuple[str, ...]) -> bool:
              return path == WORKFLOW or path.startswith(prefixes)


          def have(sha: str) -> bool:
              if not SHA_RE.fullmatch(sha):
                  return False
              probe = subprocess.run(
                  ["git", "cat-file", "-e", f"{sha}^{{commit}}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              return probe.returncode == 0


          def ensure(sha: str) -> None:
              if have(sha):
                  return
              if not SHA_RE.fullmatch(sha):
                  raise ValueError("not a commit sha")
              fetched = subprocess.run(
                  ["git", "fetch", "--no-tags", "origin", sha],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False,
              )
              if fetched.returncode != 0 or not have(sha):
                  detail = fetched.stderr.strip() or "fetch failed"
                  raise ValueError(detail)


          def changed(range_expr: str) -> list[str]:
              listed = subprocess.run(
                  ["git", "diff", "--name-only", range_expr],
                  text=True,
                  capture_output=True,
                  check=True,
              )
              return [line for line in listed.stdout.splitlines() if line]


          def files_for_event() -> list[str] | None:
              if EVENT == "workflow_dispatch":
                  return None
              if EVENT == "pull_request":
                  base = os.environ.get("BASE_SHA", "")
                  head = os.environ.get("HEAD_SHA", "")
                  ensure(base)
                  ensure(head)
                  return changed(f"{base}...{head}")
              if EVENT == "push":
                  before = os.environ.get("BEFORE_SHA", "")
                  sha = os.environ.get("SHA", "")
                  if before == ZERO or not before:
                      return None
                  ensure(before)
                  ensure(sha)
                  return changed(f"{before}..{sha}")
              return None


          def main() -> None:
              try:
                  files = files_for_event()
              except (OSError, subprocess.CalledProcessError, ValueError) as exc:
                  print(f"path filter failed open: {exc}", file=sys.stderr)
                  emit(True, True)
                  return
              if files is None:
                  emit(True, True)
                  return
              shown = files[:40]
              print(f"{len(files)} changed path(s)")
              for name in shown:
                  print(f"  {name}")
              if len(files) > len(shown):
                  print(f"  ... {len(files) - len(shown)} more")
              emit(
                  any(flagged(path, GENERATOR_PREFIXES) for path in files),
                  any(flagged(path, CORE_PREFIXES) for path in files),
              )


          main()
          PY

      - name: Commit messages
        run: python3 tools/checks/commit_messages.py
      - name: Game dialogue
        run: python3 tools/checks/no_game_dialogue.py
      - name: Mod deploy
        run: python3 tools/checks/no_deploy_on_build.py
      - name: Player choices
        run: python3 tools/checks/player_choice_silent.py
      - name: Fish key
        run: python3 tools/checks/fish_key.py

      # Dieselbe uv-Version, mit der generator/uv.lock erzeugt wurde.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.paths.outputs.generator == 'true'
        with:
          version: "0.11.27"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: generator/uv.lock

      - name: Install ffmpeg
        if: steps.paths.outputs.generator == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: Install from lockfile
        if: steps.paths.outputs.generator == 'true'
        working-directory: generator
        run: uv sync --frozen --extra dev

      - name: Ruff
        if: steps.paths.outputs.generator == 'true'
        working-directory: generator
        run: uv run ruff check . && uv run ruff format --check .

      - name: Mypy
        if: steps.paths.outputs.generator == 'true'
        working-directory: generator
        run: uv run mypy

      - name: Pytest
        if: steps.paths.outputs.generator == 'true'
        working-directory: generator
        run: uv run pytest -q -ra

      # net8.0 tests build the net6.0 library. The 8.0 SDK covers both.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.paths.outputs.core == 'true'
        with:
          dotnet-version: "8.0.x"

      - name: Test DrovaVoice.Core
        if: steps.paths.outputs.core == 'true'
        run: dotnet test mod/DrovaVoice.Core.Tests/DrovaVoice.Core.Tests.csproj -c Release --verbosity minimal
